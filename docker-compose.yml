services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-url_shortener}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-url_shortener}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  cache:
    image: valkey/valkey:9.1.1
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: abelharo2/url-shortener-backend:latest
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-url_shortener}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify}
      DB_NAME: ${DB_NAME:-url_shortener}
      CACHE_HOST: cache
      CACHE_PORT: "6379"
      CACHE_TTL: ${CACHE_TTL:-1h}
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Coolify}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-168h}
      # The bundled PostgreSQL service does not expose TLS.
      PRODUCTION: true
      GIN_MODE: release
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0.0.0.0/0}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: abelharo2/url-shortener-frontend:latest
    expose:
      - "80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
